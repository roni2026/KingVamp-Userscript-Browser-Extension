<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KingVamp Editor</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <style>
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column}
    #app{display:flex;flex-direction:column;height:100vh}
    .editor-main{display:flex;flex:1;overflow:hidden}
    .editor-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
    .CodeMirror{height:100%!important;font-family:var(--mono)!important;font-size:13px!important;background:var(--bg)!important;color:var(--text)!important}
    .CodeMirror-scroll{height:100%!important}
    .CodeMirror-gutters{background:var(--bg2)!important;border-right:1px solid var(--border)!important}
    .CodeMirror-linenumber{color:var(--muted2)!important}
    .CodeMirror-cursor{border-left-color:var(--red)!important}
    .CodeMirror-selected{background:rgba(225,6,44,0.15)!important}
    .CodeMirror-focused .CodeMirror-selected{background:rgba(225,6,44,0.2)!important}
    .cm-searching{background:rgba(245,158,11,0.25)!important;outline:1px solid var(--yellow)!important}
    .sidebar{width:260px;border-left:1px solid var(--border);overflow-y:auto;background:var(--bg2);display:flex;flex-direction:column;flex-shrink:0}
    .sidebar-section{padding:14px;border-bottom:1px solid var(--border)}
    .sidebar-section h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted2);margin-bottom:10px}
    .meta-field{margin-bottom:8px}
    .meta-field label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:4px}
    .meta-field input,.meta-field select,.meta-field textarea{width:100%;font-size:12px;padding:5px 8px}
    .meta-field textarea{min-height:50px;resize:vertical}
    .match-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
    .match-row{display:flex;gap:4px}
    .match-row input{flex:1;font-size:11px;padding:4px 7px}
    .match-row button{padding:4px 7px}
    .scan-results{font-size:11px}
    .scan-ok{color:var(--green);display:flex;align-items:center;gap:6px}
    .scan-item-sm{padding:5px 0;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:flex-start}
    .scan-item-sm:last-child{border-bottom:none}
    .scan-sev-sm{font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 4px;border-radius:3px;flex-shrink:0}
    .scan-sev-sm.danger{background:rgba(225,6,44,0.15);color:var(--red)}
    .scan-sev-sm.warn{background:rgba(245,158,11,0.1);color:var(--yellow)}
    .scan-sev-sm.info{background:rgba(59,130,246,0.1);color:var(--blue)}
    .status-bar{display:flex;align-items:center;gap:12px;padding:5px 14px;border-top:1px solid var(--border);background:var(--bg2);font-size:11px;color:var(--muted);flex-shrink:0;font-family:var(--mono)}
    .status-bar .status-item{display:flex;align-items:center;gap:5px}
    .status-bar .status-sep{width:1px;height:12px;background:var(--border)}
    #statusDirty{color:var(--yellow)}
    #statusDirty:not(.visible){display:none}
    .editor-toolbar{gap:6px;flex-wrap:nowrap;overflow-x:auto}
    .editor-toolbar .toolbar-spacer{flex:1;min-width:20px}
  </style>
</head>
<body>
<div id="app">
  <div class="kv-head editor-toolbar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M3 18L3 7L8 11L12 4L16 11L21 7L21 18Z" fill="#e1062c"/>
        <path d="M8 20L9.5 20L8.75 23ZM14.5 20L16 20L15.25 23Z" fill="#eceaf2"/>
      </svg>
      <span class="brand-name" style="font-size:14px">King<span class="vamp">Vamp</span></span>
    </div>
    <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
    <span id="editorTitle" style="font-size:13px;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">New Script</span>
    <span id="statusDirty">●</span>
    <div class="toolbar-spacer"></div>
    <div class="btn-group">
      <button class="btn sm" id="btnUndo" title="Undo (Ctrl+Z)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      </button>
      <button class="btn sm" id="btnRedo" title="Redo (Ctrl+Y)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <button class="btn sm" id="btnFormat" title="Format code">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
      Format
    </button>
    <button class="btn sm" id="btnFind" title="Find (Ctrl+F)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Find
    </button>
    <button class="btn sm" id="btnScanNow" title="Run safety scan">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Scan
    </button>
    <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
    <button class="btn sm" id="btnDash">← Dashboard</button>
    <button class="btn sm primary" id="btnSave">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
  </div>

  <div class="editor-main">
    <div class="editor-wrap">
      <textarea id="editor"></textarea>
    </div>
    <div class="sidebar">
      <div class="sidebar-section">
        <h4>Metadata</h4>
        <div class="meta-field"><label>Name</label><input type="text" id="mName" placeholder="My Script"></div>
        <div class="meta-field"><label>Version</label><input type="text" id="mVersion" placeholder="1.0.0"></div>
        <div class="meta-field"><label>Description</label><textarea id="mDesc" placeholder="What does this script do?"></textarea></div>
        <div class="meta-field"><label>Author</label><input type="text" id="mAuthor" placeholder="Your Name"></div>
        <div class="meta-field"><label>Namespace</label><input type="text" id="mNs" placeholder="https://yoursite.com/"></div>
        <div class="meta-field">
          <label>Run At</label>
          <select id="mRunAt">
            <option value="document-idle">document-idle</option>
            <option value="document-end">document-end</option>
            <option value="document-start">document-start</option>
            <option value="document-body">document-body</option>
          </select>
        </div>
        <div class="meta-field"><label>Icon URL</label><input type="text" id="mIcon" placeholder="https://…/favicon.ico"></div>
        <div class="meta-field"><label>Update URL</label><input type="text" id="mUpdateUrl" placeholder="https://…/script.meta.js"></div>
      </div>
      <div class="sidebar-section">
        <h4>Match Patterns</h4>
        <div class="match-list" id="matchList"></div>
        <button class="btn ghost sm" id="btnAddMatch">+ Add @match</button>
        <div style="margin-top:10px">
          <h4 style="margin-bottom:6px">Exclude</h4>
          <div class="match-list" id="excludeList"></div>
          <button class="btn ghost sm" id="btnAddExclude">+ Add @exclude</button>
        </div>
      </div>
      <div class="sidebar-section">
        <h4>@grant</h4>
        <div id="grantList" style="display:flex;flex-direction:column;gap:4px;font-size:12px"></div>
        <select id="grantAdd" style="width:100%;margin-top:8px;font-size:11px;padding:5px 7px">
          <option value="">+ Add @grant…</option>
          <option value="GM_getValue">GM_getValue</option>
          <option value="GM_setValue">GM_setValue</option>
          <option value="GM_deleteValue">GM_deleteValue</option>
          <option value="GM_listValues">GM_listValues</option>
          <option value="GM_addStyle">GM_addStyle</option>
          <option value="GM_log">GM_log</option>
          <option value="GM_xmlhttpRequest">GM_xmlhttpRequest</option>
          <option value="GM_notification">GM_notification</option>
          <option value="GM_openInTab">GM_openInTab</option>
          <option value="GM_setClipboard">GM_setClipboard</option>
          <option value="GM_download">GM_download</option>
          <option value="GM_getResourceText">GM_getResourceText</option>
          <option value="GM_getResourceURL">GM_getResourceURL</option>
          <option value="GM_registerMenuCommand">GM_registerMenuCommand</option>
          <option value="GM_cookie.list">GM_cookie.list</option>
          <option value="GM_cookie.set">GM_cookie.set</option>
          <option value="GM_cookie.delete">GM_cookie.delete</option>
          <option value="GM_addValueChangeListener">GM_addValueChangeListener</option>
          <option value="GM_info">GM_info</option>
          <option value="unsafeWindow">unsafeWindow</option>
          <option value="none">none</option>
        </select>
      </div>
      <div class="sidebar-section">
        <h4>@require</h4>
        <div class="match-list" id="requireList"></div>
        <button class="btn ghost sm" id="btnAddRequire">+ Add @require</button>
      </div>
      <div class="sidebar-section">
        <h4>Safety Scan</h4>
        <div id="scanResults" class="scan-results"><span style="color:var(--muted)">Click Scan to analyse</span></div>
      </div>
      <div class="sidebar-section" id="scriptInfoBox" style="display:none">
        <h4>Script Info</h4>
        <div id="scriptInfo" style="font-size:11px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 10px"></div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-item" id="statusLine">Ln 1, Col 1</span>
    <div class="status-sep"></div>
    <span class="status-item" id="statusLines">0 lines</span>
    <div class="status-sep"></div>
    <span class="status-item">JavaScript</span>
    <div class="toolbar-spacer"></div>
    <span class="status-item" id="statusSaved"></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<script src="editor.js"></script>
</body>
</html>
