<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KingVamp — Install Script</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <style>
    body{max-width:820px;margin:0 auto;padding:24px 20px}
    .install-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:20px}
    .install-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:16px}
    .install-icon{width:52px;height:52px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;font-weight:700;color:var(--red)}
    .install-icon img{width:36px;height:36px;border-radius:6px;object-fit:contain}
    .install-title{font-size:20px;font-weight:700;margin-bottom:4px}
    .install-desc{font-size:13px;color:var(--muted);margin-bottom:8px}
    .install-badges{display:flex;gap:8px;flex-wrap:wrap}
    .install-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border);border-top:1px solid var(--border)}
    .install-meta-cell{background:var(--card);padding:12px 20px}
    .install-meta-cell dt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted2);margin-bottom:4px}
    .install-meta-cell dd{font-size:12px;color:var(--text);word-break:break-all}
    .permissions{padding:16px 24px;border-bottom:1px solid var(--border)}
    .permissions h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted2);margin-bottom:10px}
    .perm-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
    .perm-item:last-child{border-bottom:none}
    .perm-icon{font-size:16px;flex-shrink:0;margin-top:1px}
    .perm-name{font-weight:600;font-size:12px}
    .perm-desc{font-size:11px;color:var(--muted);margin-top:2px}
    .install-code{padding:16px 24px;border-bottom:1px solid var(--border)}
    .install-code h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .code-preview{border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
    .CodeMirror{height:260px!important;font-size:12px!important;font-family:var(--mono)!important}
    .install-actions{padding:16px 24px;display:flex;gap:10px;align-items:center}
    .install-update-notice{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:var(--r-sm);padding:10px 16px;font-size:12px;color:var(--yellow);margin:0 24px 16px;display:flex;gap:10px;align-items:center}
    .scan-issues{padding:12px 24px;border-bottom:1px solid var(--border);display:none}
    .scan-issues h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--yellow);margin-bottom:8px}
    .loading{padding:60px;text-align:center;color:var(--muted);font-size:13px}
    .loading svg{margin:0 auto 16px;display:block;opacity:0.3}
  </style>
</head>
<body>
  <div class="kv-head" style="position:static;margin:-24px -20px 0;border-radius:0">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M3 18L3 7L8 11L12 4L16 11L21 7L21 18Z" fill="#e1062c"/>
        <path d="M8 20L9.5 20L8.75 23ZM14.5 20L16 20L15.25 23Z" fill="#eceaf2"/>
      </svg>
      <div class="brand">
        <div class="brand-name">King<span class="vamp">Vamp</span></div>
        <div class="brand-tag">Install Userscript</div>
      </div>
    </div>
  </div>
  <div id="root">
    <div class="loading">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Loading script…
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="install.js"></script>
</body>
</html>
